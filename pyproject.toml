[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Keiju Asagi <asagi@tepidworks.jp>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12.8"
fastapi = "^0.115.6"
uvicorn = "^0.34.0"
sqlalchemy = "^2.0.36"
aiosqlite = "^0.20.0"
pyright = "^1.1.392"
google-auth = "^2.38.0"
google-auth-oauthlib = "^1.2.1"
google-api-python-client = "^2.166.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.4"
httpx = "^0.28.1"
black = "^24.10.0"
isort = "^5.13.2"
pytest = "^8.3.4"
taskipy = "^1.14.1"
pytest-asyncio = "^0.25.1"
coverage = "^7.6.10"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
indent-width = 4
line-length = 160

[tool.black]
line-length = 160

[tool.isort]
profile = "black"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__init__.py"
]

[tool.taskipy.tasks]
start = "poetry run uvicorn app.main:app --reload"
test = "poetry run pytest"
lint = "poetry run black .; poetry run isort . -q; poetry run ruff check . --fix; poetry run pyright ."
db = "poetry run sqlite3 db.sqlite3"
