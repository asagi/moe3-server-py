name: Notify Discord on Push

on:
  push:
    branches:
      - '**'

jobs:
  notify_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ブランチ名を取得
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: 直近のコミット情報を取得
        run: |
          MESSAGE=$(git log -1 --pretty=%B | head -n 1)
          MESSAGE=$(echo "$MESSAGE" | sed 's/[#$]/\\&/g')
          echo "MESSAGE=$MESSAGE" >> $GITHUB_ENV
          echo "COMMIT_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" >> $GITHUB_ENV

      - name: プッシュタイプの決定
        run: |
          # 現在のブランチ名を取得
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          BRANCH_CREATED=false

          # 新規ブランチの作成を検出
          # ブランチ作成の最初のコミットを検出
          if git log --oneline --decorate -n 1 | grep -q "initial commit"; then
            BRANCH_CREATED=true
          fi

          # 新規ブランチ作成が確認できた場合
          if [ "$BRANCH_CREATED" = true ]; then
            echo "TYPE=created" >> $GITHUB_ENV
            echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          elif git log -1 --merges --pretty=%B; then
            # マージがあれば、マージの詳細を取得
            MERGE_STATUS=$(git log -1 --merges --pretty=%B)
            MERGE_BASE=$(git merge-base HEAD $(git rev-parse --abbrev-ref HEAD))
            BASE_BRANCH=$(git rev-parse --abbrev-ref $MERGE_BASE)
            TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            echo "TYPE=merge" >> $GITHUB_ENV
            echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
            echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          elif git diff --quiet HEAD^ HEAD; then
            # 差分がない場合
            echo "TYPE=ff" >> $GITHUB_ENV
          else
            # 他のプッシュの場合（通常の更新）
            echo "TYPE=updated" >> $GITHUB_ENV
          fi

      - name: Discord に通知
        env:
          TYPE: ${{ env.TYPE }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          MESSAGE: ${{ env.MESSAGE }}
          COMMIT_URL: ${{ env.COMMIT_URL }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        run: |
          if [ "$TYPE" = "created" ]; then
            ICON="🌱"
            TITLE="$ICON Branch $BRANCH_NAME was created"
            DESCRIPTION="A new branch $BRANCH_NAME was created."
          elif [ "$TYPE" = "updated" ]; then
            ICON="✏️"
            TITLE="$ICON Branch $BRANCH_NAME was updated"
            DESCRIPTION="$MESSAGE"
          elif [ "$TYPE" = "merge" ]; then
            ICON="🔀"
            TITLE="$ICON Branch $BRANCH_NAME was merged"
            DESCRIPTION="Merged $BASE_BRANCH into $TARGET_BRANCH."
          elif [ "$TYPE" = "ff" ]; then
            ICON="📦"
            TITLE="$ICON Branch $BRANCH_NAME was fast-forwarded"
            DESCRIPTION="No commit message shown (as it is a fast-forward)."
          else
            ICON="✏️"
            TITLE="$ICON Branch $BRANCH_NAME was updated"
            DESCRIPTION="$MESSAGE"
          fi

          # メッセージの構成
          JSON=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg url "${{ env.COMMIT_URL }}" \
            '{
              embeds: [
                {
                  title: $title,
                  description: $description,
                  url: $url,
                  color: 5814783
                }
              ]
            }'
          )

          # JSONを確認（デバッグ）
          echo "Generated JSON: $JSON"

          # Discordへ通知を送信
          curl -v -H "Content-Type: application/json" \
               -X POST \
               -d "$JSON" \
               ${{ secrets.DISCORD_WEBHOOK }}
