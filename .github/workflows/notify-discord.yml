name: Notify Discord on Push

on:
  push:
    branches:
      - '**'

jobs:
  notify_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ブランチ名を取得
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: 直近のコミット情報を取得
        run: |
          MESSAGE=$(git log -1 --pretty=%B | head -n 1)
          MESSAGE=$(echo "$MESSAGE" | sed 's/[#$]/\\&/g')
          echo "MESSAGE=$MESSAGE" >> $GITHUB_ENV
          echo "COMMIT_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" >> $GITHUB_ENV

      - name: プッシュタイプの決定
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          BRANCH_CREATED=false
          MERGE_DETECTED=false

          # 新規ブランチ作成の検出
          # 現在のブランチが他のブランチに含まれていないか、初回コミットか確認
          if ! git branch --contains HEAD | grep -q 'main\|develop'; then
            # 新規ブランチとして判定
            BRANCH_CREATED=true
            echo "TYPE=created" >> $GITHUB_ENV
            echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          fi

          # マージ操作の判定
          # git log -1 を使ってマージコミットを判定
          if git log -1 | grep -q "^Merge:"; then
            # マージコミットとして処理
            MERGE_DETECTED=true
            COMMIT_MESSAGE=$(git log -1 --pretty=%B)
            echo "TYPE=merge" >> $GITHUB_ENV
            echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          fi

          # 更新の判定（差分がある場合）
          if ! git diff --quiet HEAD^ HEAD && ! $MERGE_DETECTED; then
            echo "TYPE=updated" >> $GITHUB_ENV
            echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          fi

          # Fast-forward の判定（差分がない場合）
          if git diff --quiet HEAD^ HEAD && ! $MERGE_DETECTED; then
            echo "TYPE=ff" >> $GITHUB_ENV
          fi

      - name: Discord に通知
        env:
          TYPE: ${{ env.TYPE }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          MESSAGE: ${{ env.MESSAGE }}
          COMMIT_URL: ${{ env.COMMIT_URL }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        run: |
          if [ "$TYPE" = "created" ]; then
            ICON="🌱"
            TITLE="$ICON Branch $BRANCH_NAME was created"
            DESCRIPTION="A new branch $BRANCH_NAME was created."
          elif [ "$TYPE" = "updated" ]; then
            ICON="✏️"
            TITLE="$ICON Branch $BRANCH_NAME was updated"
            DESCRIPTION="$MESSAGE"
          elif [ "$TYPE" = "merge" ]; then
            ICON="🔀"
            TITLE="$ICON Branch $BRANCH_NAME was merged"
            DESCRIPTION=$MESSAGE"
          elif [ "$TYPE" = "ff" ]; then
            ICON="📦"
            TITLE="$ICON Branch $BRANCH_NAME was fast-forwarded"
            DESCRIPTION="No commit message shown (as it is a fast-forward)."
          else
            ICON="✏️"
            TITLE="$ICON Branch $BRANCH_NAME was updated"
            DESCRIPTION="$MESSAGE"
          fi

          # メッセージの構成
          JSON=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg url "${{ env.COMMIT_URL }}" \
            '{
              embeds: [
                {
                  title: $title,
                  description: $description,
                  url: $url,
                  color: 5814783
                }
              ]
            }'
          )

          # JSONを確認（デバッグ）
          echo "Generated JSON: $JSON"

          # Discordへ通知を送信
          curl -v -H "Content-Type: application/json" \
               -X POST \
               -d "$JSON" \
               ${{ secrets.DISCORD_WEBHOOK }}
